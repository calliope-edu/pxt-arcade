<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calliope mini GameKit Simulator</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* console graphic 578 x 682 (viewBox of the SVG) */
        #console {
            position: relative;
            width: min(100vw, calc(100vh * 578 / 682));
            aspect-ratio: 578 / 682;
        }
        #console svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* game screen on top of the "Screen" rect (x 26, y 27, 524 x 394.1) */
        #paint-surface {
            position: absolute;
            left: calc(100% * 26 / 578);
            top: calc(100% * 27 / 682);
            width: calc(100% * 524 / 578);
            height: calc(100% * 394.1 / 682);
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .sim-button {
            cursor: pointer;
        }
        /* pressed: independent of the class names Illustrator uses in the SVG */
        .sim-button.pressed {
            filter: brightness(1.6);
        }
    </style>
</head>
